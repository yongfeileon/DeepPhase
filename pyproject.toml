[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-phase"
version = "0.1.0"
description = "基于 Claude Agent SDK 的长程进度自动推进能力"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "yongfeileon", email = "your.email@example.com"}
]
keywords = ["claude", "agent", "phase-runner", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "claude-agent-sdk",
    "python-dotenv",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/yongfeileon/DeepPhase"
Repository = "https://github.com/yongfeileon/DeepPhase"
Issues = "https://github.com/yongfeileon/DeepPhase/issues"

[tool.setuptools.packages.find]
where = ["src"]
